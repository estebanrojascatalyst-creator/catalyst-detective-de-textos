#app{max-width:600px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{font-family:"Josefin Sans",Georgia,sans-serif;color:var(--g);margin:.2em 0 .3em;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:2.2rem;text-shadow:2px 2px 0 var(--tan)}h2{font-size:1.45rem}h3{font-size:1.05rem;margin-top:14px}
.mute{color:var(--mute);font-size:.88rem;margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.txt p{margin:0 0 .7em;font-size:.95rem}.txt{max-height:340px;overflow-y:auto}.txt h2{text-transform:none;font-size:1.25rem}
.txt img{width:100%;border-radius:10px;display:block}
.say{display:flex;gap:10px;align-items:flex-end;margin:12px 0}.say img{width:58px;flex:none}
.say p{background:var(--card2);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;margin:0;font-size:.9rem}
.say.ok p{background:var(--okbg);border-color:var(--ok)}
.btn{display:block;width:100%;text-align:center;font:600 1rem Poppins,sans-serif;background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:13px 16px;margin:10px 0 0;cursor:pointer}
.btn.alt{background:transparent;color:var(--g);border:2px solid var(--m)}.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--m);outline-offset:2px}
input[type=text]{width:100%;font:500 1rem Poppins,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px}
label{font-weight:600;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{font:500 .92rem Poppins,sans-serif;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer}
.chip.on{border-color:var(--m);background:var(--card);box-shadow:inset 0 0 0 1px var(--m);font-weight:600}
.chip.good{border-color:var(--ok);background:var(--okbg)}.chip.bad{border-color:var(--bad);background:var(--badbg)}
.opt{display:block;width:100%;text-align:left;font:400 .9rem Poppins,sans-serif;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 13px;margin:0 0 8px;cursor:pointer}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.dots{display:flex;gap:6px;margin:4px 0 10px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--m)}.dots i.cur{background:var(--tan)}
.err{color:var(--bad);font-size:.85rem;margin:2px 0}
.q{font-weight:600;margin:0 0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3 .card{margin:0;padding:10px 12px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.scroll{overflow-x:auto}
footer{text-align:center;color:var(--mute);font-size:.76rem;margin-top:26px}.tl{background:none;border:0;color:var(--mute);font:400 .76rem Poppins,sans-serif;text-decoration:underline;cursor:pointer;margin-left:8px}
.hero{text-align:center}.hero img.lg{width:150px}.hero .logo{width:54px;height:54px;border-radius:50%;border:2px solid var(--tan)}
.score{font:700 3rem "Josefin Sans",sans-serif;color:var(--g);text-align:center;line-height:1}

{t:"¿Qué es un insecto?",p:["Los insectos son las criaturas más logradas del reino animal. Se adaptan a todo de manera sorprendente y viven en diversos lugares, tanto a ras de tierra como en el aire y en el agua. Pueden verse insectos en los abrasadores desiertos y junto a los manantiales de agua hirviente, también en las cimas nevadas de las montañas y en los lagos helados. Son invertebrados, lo cual quiere decir que, a diferencia de los mamíferos, peces, reptiles y aves, no tienen espina dorsal. Pertenecen al grupo de los artrópodos porque poseen patas articuladas y un esqueleto externo que los protege; sin embargo, son diferentes de los demás artrópodos porque solo tienen seis patas.","Un insecto adulto nunca crece mucho debido a su esqueleto externo, formado en gran parte por una sustancia resistente llamada quitina. Este exoesqueleto recubre todas las partes de su cuerpo, incluidas las patas, los ojos, las antenas y hasta los tubos internos para respirar (tráquea). Los insectos jóvenes tienen que renovar constantemente estas superficies, es decir, mudar varias veces de piel hasta llegar a la talla adulta. Debajo de la piel vieja y dura se forma un nuevo esqueleto blando; el insecto absorbe una cantidad suplementaria de aire para crecer y reventar la vieja piel, que se desprende. En sus fases jóvenes, muchos insectos toman forma de larvas o de orugas que difieren mucho de los adultos; también mudan transformándose en pupas o crisálidas."],
fm:"Continuo",int:"Informativo",es:["Descriptiva","Expositiva"],ex:"Es un texto en párrafos (continuo) que transmite información sobre un tema a un lector con poco conocimiento (expositiva) y detalla rasgos y cualidades de los insectos (descriptiva).",
q:"Desde la información que brinda el texto, ¿qué implica decir que los insectos son diferentes de los demás artrópodos porque solo tienen seis patas?",o:["Que todos los artrópodos son insectos.","Que hay artrópodos con diferente número de patas.","Que todos los artrópodos tienen la misma cantidad de patas.","Que hay insectos con más de seis patas."],a:1,why:"Si lo que distingue a los insectos es tener solo seis patas, es porque otros artrópodos tienen un número distinto."},
{t:"Cómic de Mafalda",img:1,fm:"Discontinuo",int:"Literario",es:["Narrativa"],ex:"Un cómic combina imagen y texto en viñetas y se lee de forma no lineal (discontinuo). Es literario según el material de la clase y narra una pequeña escena: el padre habla y Mafalda responde.",
q:"La expresión en la cara del padre al oír la pregunta de Mafalda se debe a que",o:["no está de acuerdo con lo que dice Mafalda.","no entendió lo que Mafalda quería decir.","le disgustó que Mafalda lo interrumpiera tan súbitamente.","no esperaba la interpretación que hizo Mafalda de sus palabras."],a:3,why:"El padre hablaba en sentido literal y Mafalda entendió otra cosa. Su gesto muestra sorpresa ante esa interpretación inesperada."},
{t:"La tentación del mar",p:["Con la esperanza de embarcar rumbo a cualquier país, llegué a Puerto Cortés, en la costa Atlántica, no muy distante de San Pedro Sula. El puerto, más que esto, era un embarcadero de plátanos. Millones de racimos esperaban ser embarcados en un vapor de la United Fruit Company, el gran barco frutero del que el «Abuelo» me había prevenido tanto.","El imperativo categórico del hambre me convirtió nuevamente en cargador, y ocupando un lugar en la hilera de braceros que corrían de los vagones al barco, dejaron caer sobre mis hombros pesados racimos. Uno de ellos, de tamaño descomunal, me aplastó con su peso, fragmentándose en varios pedazos. Los braceros habían comprendido la urgencia que tenía de trabajar para comer y excusaron mi debilidad física al lado de sus vigorosos cuerpos. Los alzadores tuvieron buen cuidado de escogerme racimos de poco peso, cosa que les agradecí más tarde con unos vasos de cerveza.","Así, pensé quedarme en la bodega del barco cuando el último racimo estuvo a bordo. Un amigo, a quien le confesé mis deseos, me aseguró que nunca pisaría puerto americano, pues si era descubierto en la bodega, me alistarían de inmediato para los frentes yanquis del Pacífico.","La tentación del mar era grande. Siempre, desde pequeño, había soñado con viajar en un barco frutero y ahora, cuando se presentaba la ocasión, la guerra me hacía temer. Tuve deseos de arriesgar todo con tal de sentirme en el mar, pero un escrúpulo no definido por ciertos aspectos de la guerra me dejó acobardado en tierra firme. Al día siguiente estuve observando la costa. El litoral de Honduras sobre el Atlántico está gruesamente poblado por negros, mulatos y mestizos. En algunas poblaciones costaneras, como La Lima y La Ceiba, el elemento negro predomina, todavía sumiso a los plantíos de banano como desde los tiempos de la esclavitud. El lempira o el dólar que corre con prontitud por sus manos es ahora látigo de la sumisión. Observando algunos dialectos y costumbres de auténtico sabor negróide, tuve la sensación de hallarme en un pueblo africano."],
fm:"Continuo",int:"Informativo",es:["Descriptiva","Narrativa"],ex:"Está en párrafos (continuo). Cuenta hechos en orden cronológico (llegada al puerto, trabajo, decisión) y describe el puerto, la costa y su gente: narración y descripción.",
q:"¿Cuál de los siguientes fragmentos del texto expresa un juicio de valor?",o:["«Siempre, desde pequeño, había soñado con viajar en un barco frutero y ahora, cuando se presentaba la ocasión, la guerra me hacía temer».","«Tuve deseos de arriesgar todo con tal de sentirme en el mar, pero un escrúpulo no definido por ciertos aspectos de la guerra me dejó acobardado en tierra firme».","«En algunas poblaciones costaneras, como La Lima y La Ceiba, el elemento negro predomina, todavía sumiso a los plantíos de banano como desde los tiempos de la esclavitud».","«El puerto, más que esto, era un embarcadero de plátanos. Millones de racimos esperaban ser embarcados en un vapor de la United Fruit Company [...]»."],a:2,why:"Un juicio de valor es una valoración del autor sobre algo o alguien. Llamar «sumiso» a un grupo humano es una valoración; las demás opciones cuentan deseos, temores o describen hechos."},
{t:"El día después",p:["Bennet seguía mirando el barrizal en el que se habían convertido las plantaciones de algodón vecinas. Observaba los troncos de los árboles por el campo. Árboles que nacieron a más de una milla de distancia de allí fueron arrastrados hasta sus predios por el huracán. Hoag, en cambio, estaba atento a los lamentos de los esclavos, sin comprenderlos, cosa que lo enfurecía cada vez más. Le decía a Bennet:","—A estos haraganes —y miraba a los esclavos regados por la falda de la loma, hurgando entre los escombros— si no los necesitara, te juro que los ahorcaba a todos. Creo que es lo único que recompensaría la ira que siento. Tal parece que se regocijan de nuestro fracaso.","—Si trataras de entenderlos, los comprenderías y, como te he repetido en otras ocasiones, te rendirían mucho más.","A lo cual Hoag respondió con ira:","—Bennet, tú te has dedicado a tratar de descifrar a esos salvajes porque para ti el trabajo es un deporte y en los deportes es imposible comprender y conocer el funcionamiento de los instrumentos. Para mí, el trabajo es una desgracia que exige de mí todo. Y como hoy, su recompensa puede ser nada. Me importa únicamente que rindan, no quiero indagar en el funcionamiento de sus cerebros: o me sirven o los vendo. El único trabajo que no les impondré es tratar de pensar, si es que esos salvajes son capaces; y menos aún trataré de hacerles creer que sus pensamientos podrían coincidir con los míos."],
fm:"Continuo",int:"Literario",es:["Descriptiva","Narrativa","Argumentativa"],ex:"Es un texto continuo y literario. Narra una escena, describe el paisaje devastado y los dos personajes sostienen posturas opuestas con razones: narración, descripción y argumentación.",
q:"De acuerdo con la información del texto, ¿a dónde llegaron los árboles que nacieron a más de una milla de distancia?",o:["A la falda de la loma.","A los predios de Bennet.","A las plantaciones de algodón.","Al campo en general."],a:1,why:"El texto dice que esos árboles fueron arrastrados por el huracán hasta los predios del personaje que los observa: Bennet."},
{t:"Sobre la amistad",p:["Ahora me gustaría que reflexionemos sobre la amistad, sobre su naturaleza, sobre dónde radica y sobre su campo u objeto. En la medida en que vemos que ella acompaña nuestra existencia, está presente en toda ocasión y que, además, es considerada como algo positivo, nos vemos obligados a admitir que es una ayuda para la felicidad.","Por esto, considero que lo mejor sería comenzar por enumerar las dificultades y cuestiones que este análisis podría suscitar. En primer lugar, valdría la pena hacerse la siguiente pregunta: ¿Florece la amistad entre los que son iguales o semejantes, tal como opinan algunos? «Cada oveja con su pareja», dice el refrán, y «Dios los cría y ellos se juntan». Se cuenta también la historia de un perro que siempre dormía bajo el mismo tejado, y se dice que Empédocles, cuando se le preguntó por qué hacía eso el perro, dijo que había cierta afinidad entre el perro y el tejado, y que esa era la causa por la cual el primero siempre buscaba el segundo. Otros, por el contrario, piensan que la amistad surge entre los opuestos. «Cuando el suelo está seco, la tierra está enamorada de la lluvia», dice Eurípides. Con esto, sostienen que los polos opuestos se atraen, porque entre los iguales no es posible una relación de amistad. Según ellos, un semejante no tendría necesidad de otro semejante. Y así.","Otra cuestión importante es si llegar a ser amigo resulta fácil, o si más bien es algo difícil. Por ejemplo, algunos aduladores, que se juntan rápidamente a nosotros, no son amigos, aunque ellos digan que lo son."],
fm:"Continuo",int:"Informativo",es:["Argumentativa"],ex:"Es un texto continuo, de tipo ensayo (informativo según la clase). Plantea preguntas, opiniones, ejemplos y citas para sustentar una reflexión y llevar al lector a pensar sobre la amistad: argumentación.",
q:"Lea el siguiente fragmento del texto: «Por ejemplo, algunos aduladores, que se juntan rápidamente a nosotros, no son amigos, aunque ellos digan que lo son». ¿Cuál de las siguientes afirmaciones es un supuesto derivado del anterior fragmento?",o:["Las personas que se atreven a autodenominarse amigos sin conocernos son incompatibles con nosotros.","La amistad que ofrecen los aduladores está determinada por el interés de sacar provecho de esa cercanía.","La autenticidad de una amistad no puede determinarse por la ligereza con la que se desarrolla una relación.","Los amigos que forjan su vínculo halagándose entre sí desconocen el sentido de la amistad."],a:2,why:"El fragmento da por supuesto que acercarse rápido no prueba que alguien sea amigo. Las otras opciones añaden intenciones o juicios que el texto no dice."}];

let UID=null;(async()=>{try{if(window.claude&&claude.use){DB=await claude.use("db");const U=await claude.use("user");if(U&&U.id)UID=await U.id()}}catch(e){}})();
const say=(i,t,c="")=>`<div class="say ${c}"><img src="${i}" alt=""><p>${t}</p></div>`;
const foot=()=>`<footer>Catalyst Education · Lectura Crítica${S.st==="reg"?'<button class="tl" data-a="tlogin">Acceso docente</button>':""}</footer>`;
function init(){S.id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);Object.assign(S,{i:0,ph:0,f:null,n:null,e:[],pa:null,res:[],pts:0})}
const setOk=(a,b)=>a.length===b.length&&b.every(x=>a.includes(x));
function reg(){return `<div class="hero"><img class="logo" src="${IMG.logo}" alt="Catalyst Education"><h1>Detective de textos</h1><p class="mute">Clase de Lectura Crítica · Tipología textual y estrategias discursivas</p></div>
${say(IMG.bu,"Soy Clarín. En cada texto vas a descubrir qué tipo de texto es y qué estrategias usa su autor. Luego responderás una pregunta tipo Saber 11. Primero cuéntame quién eres.")}
<div class="card"><label for="nm">Nombre completo</label><input id="nm" type="text" maxlength="60" autocomplete="name" value="${esc(S.name)}" placeholder="Nombre y apellidos"><label>Curso</label><div class="chips">${["9°","10°","11°"].map(c=>`<button class="chip ${S.course===c?"on":""}" data-a="course" data-i="${c}">${c}</button>`).join("")}</div>${S.err?`<p class="err">${S.err}</p>`:""}<button class="btn" data-a="start">Empezar</button></div>`}
function intro(){return `<h2>Antes de empezar</h2>${say(IMG.bg,"Recuerda lo que vimos en clase. Úsalo como guía para cada texto.")}
<div class="grid3"><div class="card"><b>Formato</b><br>Continuo: párrafos. Discontinuo: infografías, tablas, cómics, carteles.</div><div class="card"><b>Intención</b><br>Literario: provocar emociones o entretener. Informativo: transmitir información, explicar o persuadir.</div></div>
<div class="card" style="margin-top:8px"><b>Estrategias discursivas</b> (pueden ser varias)<br><b>Descriptiva:</b> expone características, propiedades o cualidades.<br><b>Expositiva:</b> transmite información sobre un tema a quien lo conoce poco.<br><b>Narrativa:</b> cuenta acontecimientos en orden cronológico.<br><b>Argumentativa:</b> busca persuadir o cambiar la opinión del receptor.</div><button class="btn" data-a="go">Ver el primer texto</button>`}
const chips=(arr,sel,key,multi,chk,correct)=>`<div class="chips">${arr.map(v=>{const on=multi?sel.includes(v):sel===v;let c=on?"on":"";if(chk){const ok=multi?correct.includes(v):correct===v;c=ok?"good":on?"bad":""}return `<button class="chip ${c}" data-a="${key}" data-i="${v}" ${chk?"disabled":""}>${v}</button>`}).join("")}</div>`;
function play(){const x=T[S.i],chk=S.ph>=1,ok=chk?TP:{};
const body=x.img?`<h2>${x.t}</h2><img src="${IMG.maf}" alt="Cómic de Mafalda: un padre habla con un niño y Mafalda pregunta «¿El discurso de quién?»">`:`<h2>${x.t}</h2>${x.p.map(p=>`<p>${p}</p>`).join("")}`;
let h=`<div class="dots">${T.map((_,i)=>`<i class="${i<S.i?"on":i===S.i?"cur":""}"></i>`).join("")}</div><p class="mute">Texto ${S.i+1} de ${T.length} · ${S.pts} puntos</p><div class="card txt">${body}</div>
<div class="card"><h3>1. Clasifica el texto</h3><label>Según su formato</label>${chips(FM,S.f,"f",0,chk,x.fm)}<label>Según su intención comunicativa</label>${chips(IN,S.n,"n",0,chk,x.int)}<label>Estrategias discursivas (puedes marcar varias)</label>${chips(ES,S.e,"e",1,chk,x.es)}`;
if(!chk)h+=`<button class="btn" data-a="check" ${S.f&&S.n&&S.e.length?"":"disabled"}>Comprobar clasificación</button>`;
h+=`</div>`;
if(chk){h+=say(IMG.bg,`<b>${ok.f&&ok.i&&ok.e?"¡Clasificación perfecta!":"Revisa las respuestas marcadas en verde."}</b> ${x.ex}`,ok.f&&ok.i&&ok.e?"ok":"");
h+=`<div class="card"><h3>2. Responde la pregunta</h3><p class="q">${x.q}</p>${x.o.map((o,k)=>`<button class="opt ${S.ph>=2?(k===x.a?"good":k===S.pa?"bad":""):""}" data-a="opt" data-i="${k}" ${S.ph>=2?"disabled":""}>${"ABCD"[k]}. ${o}</button>`).join("")}</div>`}
if(S.ph>=2){h+=say(IMG.bu,`<b>${S.pa===x.a?"¡Correcto!":"La respuesta correcta es la "+"ABCD"[x.a]+"."}</b> ${x.why}`,S.pa===x.a?"ok":"")+`<button class="btn" data-a="next">${S.i<T.length-1?"Siguiente texto":"Ver mis resultados"}</button>`}
return h}
function end(){const m=S.res.reduce((a,r)=>({f:a.f+r.f,i:a.i+r.i,e:a.e+r.e,p:a.p+r.p}),{f:0,i:0,e:0,p:0}),n=T.length;
return `<div class="hero"><h2>¡Terminaste, ${esc(S.name.split(" ")[0])}!</h2></div><div class="score">${S.pts}<small style="font-size:1.2rem"> / ${n*5}</small></div>
${say(IMG.bu,S.pts>=n*5*.8?"Excelente trabajo: reconoces muy bien los textos y sus estrategias.":S.pts>=n*5*.5?"Buen avance. Repasa las clasificaciones que fallaste y vuelve a intentarlo con calma.":"Este tema se entrena. Repasa la guía de clase y pide ayuda a tu profe.")}
<div class="card"><b>Tu desempeño</b><br>Formato: ${m.f}/${n} · Intención: ${m.i}/${n}<br>Estrategias: ${m.e}/${n} · Preguntas: ${m.p}/${n}</div>
<p class="mute" style="text-align:center">${saved==="ok"?"✔ Tus respuestas quedaron registradas.":"Tus respuestas se guardaron solo en este dispositivo. Muéstrale esta pantalla a tu profe."}</p><button class="btn alt" data-a="again">Nueva persona</button>`}
function login(){return `<div class="card"><h2>Acceso docente</h2><p class="mute">Ingresa la contraseña para ver y descargar las respuestas.</p><input id="pw" type="password" autocomplete="off" placeholder="Contraseña">${S.err?`<p class="err">${S.err}</p>`:""}<button class="btn" data-a="tcheck">Entrar</button><button class="btn alt" data-a="again">Volver</button></div>`}
async function rows(){let r=[],src="este dispositivo";try{r=JSON.parse(localStorage.getItem("cat_res")||"[]")}catch(e){}
if(DB){try{const q=await DB.collection("respuestas").get(),d=q.docs.filter(x=>x.exists).map(x=>x.data());if(d.length){r=d;src="la base de datos"}}catch(e){}}return{r,src}}
async function teacher(){const{r,src}=await rows();TP.rows=r;r.sort((a,b)=>(a.curso+a.nombre).localeCompare(b.curso+b.nombre));
$a.innerHTML=`<h2>Resultados</h2><p class="mute">${r.length} registro(s) · fuente: ${src}</p><div class="card scroll"><table><tr><th>Nombre</th><th>Curso</th><th>Pts</th><th>Textos</th></tr>${r.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.curso)}</td><td>${x.puntaje}/${T.length*5}</td><td>${x.respuestas.length}/${T.length}${x.completado?" ✔":""}</td></tr>`).join("")||'<tr><td colspan="4">Aún no hay respuestas.</td></tr>'}</table></div><button class="btn" data-a="csv">Descargar CSV</button><button class="btn alt" data-a="again">Salir</button>`+foot()}
async function csv(){const H=["nombre","curso","fecha","puntaje","completado"];T.forEach((_,i)=>H.push(`t${i+1}_formato`,`t${i+1}_intencion`,`t${i+1}_estrategias`,`t${i+1}_pregunta`,`t${i+1}_puntos`));
const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',L=[H.join(",")];
(TP.rows||[]).forEach(x=>{const c=[x.nombre,x.curso,x.fecha,x.puntaje,x.completado?"si":"no"];T.forEach((_,i)=>{const r=x.respuestas[i];c.push(...(r?[r.formato,r.intencion,r.estrategias.join(" + "),r.pregunta,r.f+r.i+r.e+r.p*2]:["","","","",""]))});L.push(c.map(q).join(","))});
const data="\ufeff"+L.join("\n"),name="resultados-catalyst.csv";
try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=name;a.click()}
async function save(done){const rec={id:S.id,nombre:S.name,curso:S.course,fecha:new Date().toISOString(),puntaje:S.pts,completado:!!done,respuestas:S.res};let ok=false;
try{const a=JSON.parse(localStorage.getItem("cat_res")||"[]").filter(x=>x.id!==rec.id);a.push(rec);localStorage.setItem("cat_res",JSON.stringify(a))}catch(e){}
if(DB&&UID){try{await DB.collection("respuestas").doc(UID).set(rec);ok=true}catch(e){}}
if(ENDPOINT){try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)});ok=true}catch(e){}}
saved=ok?"ok":"local";if(S.st==="end")render()}
function render(){S.st==="teacher"?teacher():($a.innerHTML=({reg,intro,play,end,login}[S.st])()+foot());window.scrollTo(0,0)}
const A={
course(v){S.name=document.getElementById("nm").value;S.course=v},
start(){const n=document.getElementById("nm").value.trim().replace(/\s+/g," ");S.name=n;if(n.split(" ").length<2||n.length<5){S.err="Escribe tu nombre completo (nombre y apellido).";return}if(!S.course){S.err="Elige tu curso.";return}S.err="";init();S.st="intro"},
go(){S.st="play"},f(v){S.f=v},n(v){S.n=v},e(v){const k=S.e.indexOf(v);k<0?S.e.push(v):S.e.splice(k,1)},
check(){const x=T[S.i];TP={f:S.f===x.fm,i:S.n===x.int,e:setOk(S.e,x.es)};S.pts+=TP.f+TP.i+TP.e;S.ph=1},
opt(k){k=+k;const x=T[S.i];S.pa=k;const p=k===x.a;S.pts+=p?2:0;S.res.push({texto:x.t,formato:S.f,intencion:S.n,estrategias:S.e.slice(),pregunta:"ABCD"[k],f:+TP.f,i:+TP.i,e:+TP.e,p:+p});S.ph=2;save(false)},
next(){if(S.i<T.length-1){Object.assign(S,{i:S.i+1,ph:0,f:null,n:null,e:[],pa:null})}else{S.st="end";save(true)}},
again(){S={st:"reg",name:"",course:"",err:""}},tlogin(){S.st="login";S.err=""},
tcheck(){const v=document.getElementById("pw").value;sh(v).then(h=>{if(h===PH){S.st="teacher"}else S.err="Contraseña incorrecta.";render()}).catch(()=>{S.err="Este navegador no permite verificar la contraseña.";render()})},
csv(){csv()}};
$a.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){f(b.dataset.i);render()}});
$a.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw"){A.tcheck()}});
render();
</script></body></html>
